<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — Farance</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--dim);
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .auth-logo-mark {
      width: 32px; height: 32px;
      background: var(--accent-dim);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .auth-logo-text { font-size: 18px; font-weight: 700; color: var(--text); }
    .auth-logo-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .auth-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .auth-sub   { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .auth-field { margin-bottom: 14px; }
    .auth-field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .auth-field input {
      width: 100%; box-sizing: border-box;
      padding: 9px 12px; font-size: 13px;
      background: var(--surface2); border: 1px solid var(--dim);
      border-radius: 8px; color: var(--text);
      transition: border-color .15s;
    }
    .auth-field input:focus { outline: none; border-color: var(--accent); }
    .auth-btn {
      width: 100%; padding: 10px; margin-top: 6px;
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .auth-btn:hover { background: var(--accent-h); }
    .auth-link { text-align: center; margin-top: 18px; font-size: 12px; color: var(--muted); }
    .auth-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .auth-error {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      color: #ef4444; border-radius: 8px; padding: 9px 12px;
      font-size: 12px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div>
        <div class="auth-logo-text">Farance</div>
        <div class="auth-logo-sub">Command Center</div>
      </div>
    </div>

    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Start your free trial today</div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="auth-error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/signup">
      <div class="auth-field">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="John Smith" required autofocus/>
      </div>
      <div class="auth-field">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@company.com" required/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" minlength="8" required/>
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
    </form>

    <div class="auth-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
